# Copy to config.yaml and edit. config.yaml is gitignored.
# Secrets (API keys, tokens) never go here — use .env or the macOS keychain.

user_name: 재원
timezone: Asia/Seoul

llm:
  # Frequent commands (time, date, status, …) are always handled locally for free.
  # Everything else goes to the backend below; without its API key Jarvis runs as `off`.
  #   openai_compat: an OpenAI-compatible API — Gemini free tier by default (GEMINI_API_KEY in .env)
  #   api:           Claude API (ANTHROPIC_API_KEY in .env, billed per token)
  #   claude_code:   Claude Code CLI on a Pro/Max login (dev Mac only; needs macOS 13+)
  #   off:           local commands only
  backend: openai_compat
  openai_compat:
    provider: gemini          # gemini | groq | openrouter | github | ollama | custom
    model: null               # null = preset default (gemini: gemini-flash-latest); required for others
    # base_url: null          # only for provider: custom
    # api_key_env: null       # env var holding the key; null = preset default
    max_tokens: 1024
    extra_body: {}            # extra request fields, if a provider needs them
  # Free tiers may use inputs to improve their models, so schedule titles (and later
  # mail/Slack content) are only sent when this is true. null = true for Claude backends only.
  send_personal_data: null
  default_model: claude-haiku-4-5      # api backend
  smart_model: claude-sonnet-5-5       # api backend: daily briefing, complex requests
  claude_code_model: haiku             # claude_code backend
  max_tokens: 300                      # api backend
  daily_token_limit: 200000
  history_turns: 6
  history_reset_min: 5

voice:
  wake_word: hey_jarvis
  wake_threshold: 0.5
  tts_voice: Yuna
  tts_rate: 190           # words per minute for `say`
  stt_engine: auto        # faster_whisper | whisper_cpp | apple — pick with scripts/bench_stt.py
  stt_model: small        # whisper model size
  input_device: null      # null = system default microphone
  silence_sec: 0.8        # end of utterance after this much silence
  max_utterance_sec: 10

vision:
  camera_index: 0
  greet_after_absence_min: 10
  drowsy_ear_ratio: 0.75
  drowsy_seconds: 2.5
  active_hours: "09:00-02:00"

quiet_hours: "02:00-08:00"

calendar:
  google_calendar_ids: [primary]
  pre_alert_min: 10

spotify:
  aliases:
    공부: "spotify:playlist:XXXX"
    기상: "spotify:playlist:YYYY"

messages:
  gmail_poll_min: 5
  slack_poll_min: 3

server:
  host: 127.0.0.1
  port: 8765

ui:
  fullscreen: true
  target_fps: 30
