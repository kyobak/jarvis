[project]
name = "jarvis"
version = "0.1.0"
description = "Desk assistant HUD for an always-on MacBook"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
    "pydantic>=2.9",
    "pyyaml>=6",
    "python-dotenv>=1",
    "tzdata>=2024.1",
    "pywebview>=5.3; sys_platform == 'darwin'",
    "anthropic>=1,<2",
    "httpx2>=2.0",
    "keyring>=25",
]

[project.optional-dependencies]
# Install only what works on the target (see scripts/check_env.py):
#   uv sync --extra voice --extra stt-faster
voice = [
    "numpy>=1.24",
    # onnxruntime (wake word, Silero VAD) dropped macOS 12 / Intel after 1.19.x.
    "onnxruntime>=1.17,<1.20; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sounddevice>=0.4",
    # 0.6 needs tflite-runtime on Linux (no py3.12 wheels); 0.4 bundles its models instead.
    "openwakeword>=0.6; sys_platform == 'darwin'",
    "openwakeword>=0.4; sys_platform != 'darwin'",
    "webrtcvad-wheels>=2.0",
]
stt-faster = [
    "faster-whisper>=1.0",
    "onnxruntime>=1.17,<1.20; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
stt-cpp = [
    # 1.2.0 is the last release with Intel macOS wheels.
    "pywhispercpp>=1.2,<1.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pywhispercpp>=1.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
stt-apple = ["pyobjc-framework-Speech>=10; sys_platform == 'darwin'"]
vision = [
    "numpy>=1.24",
    # 4.10.0.84 is the last OpenCV with Intel macOS 12 wheels.
    "opencv-contrib-python>=4.8,<4.11; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "opencv-contrib-python>=4.8,<5; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
# Optional eye landmarks backend (otherwise OpenCV's LBF facemark is used).
vision-mediapipe = ["mediapipe>=0.10.14,<0.10.22"]

[project.scripts]
jarvis = "jarvis.main:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
