[project]
name = "jarvis"
version = "0.1.0"
description = "Desk assistant HUD for an always-on MacBook"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
    "pydantic>=2.9",
    "pyyaml>=6",
    "python-dotenv>=1",
    "tzdata>=2024.1",
    "pywebview>=5.3; sys_platform == 'darwin'",
]

[project.scripts]
jarvis = "jarvis.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
